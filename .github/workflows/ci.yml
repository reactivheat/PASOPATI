name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest -v --basetemp=.local/pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m build
      - name: Install built wheel in a clean environment
        shell: python
        run: |
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          import threading
          import venv
          from http.server import ThreadingHTTPServer
          from pasopati.lab import LabHandler
          venv.EnvBuilder(with_pip=True).create('.venv-wheel')
          scripts = pathlib.Path('.venv-wheel').resolve() / ('Scripts' if os.name == 'nt' else 'bin')
          python = scripts / ('python.exe' if os.name == 'nt' else 'python')
          cli = scripts / ('pasopati.exe' if os.name == 'nt' else 'pasopati')
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          subprocess.run([str(python), '-m', 'pip', 'install', str(wheel)], check=True)
          with tempfile.TemporaryDirectory() as outside:
              env = dict(os.environ)
              env.pop('PYTHONPATH', None)
              for index, command in enumerate(([str(cli)], [str(python), '-m', 'pasopati'])):
                  policy = str(pathlib.Path(outside) / f'policy-{index}.toml')
                  for args in (['--version'], ['--help'], ['doctor', '--json', '--config-dir', outside],
                               ['scan', '--help'],
                               ['init', '--path', policy, '--json'],
                               ['config', 'validate', '--config', policy, '--json'],
                               ['scope', 'check', 'example.invalid', '--config', policy, '--json'],
                               ['profiles', 'list', '--json'], ['profiles', 'show', 'safe', '--json']):
                      result = subprocess.run(command + args, cwd=outside, env=env, check=True,
                                              capture_output=True, text=True, encoding='utf-8', timeout=30)
                      assert not result.stderr, result.stderr
                      if '--json' in args:
                          assert json.loads(result.stdout)['ok'] is True
                          assert '\x1b' not in result.stdout
              subprocess.run([str(python), '-c',
                              'import pathlib, sys, pasopati.recon; '
                              'assert pathlib.Path(pasopati.recon.__file__).is_relative_to(sys.prefix)'],
                             cwd=outside, env=env, check=True)
              with ThreadingHTTPServer(('127.0.0.1', 0), LabHandler) as server:
                  worker = threading.Thread(target=server.serve_forever,
                                            kwargs={'poll_interval': 0.01}, daemon=True)
                  worker.start()
                  try:
                      lab_config = pathlib.Path(outside) / 'lab.toml'
                      lab_config.write_text('schema_version = 1\nprofile = "safe"\nauthorized = true\n'
                                            '[scope]\nallow_cidrs = ["127.0.0.1/32"]\n'
                                            f'ports = [{server.server_port}]\nallow_private = true\n',
                                            encoding='utf-8')
                      for index, command in enumerate(([str(cli)], [str(python), '-m', 'pasopati'])):
                          output = pathlib.Path(outside) / f'recon-{index}'
                          result = subprocess.run(command + ['scan',
                              f'http://127.0.0.1:{server.server_port}/', '--config', str(lab_config),
                              '--output', str(output), '--include-titles', '--json'],
                              cwd=outside, env=env, check=True, capture_output=True,
                              text=True, encoding='utf-8', timeout=30)
                          payload = json.loads(result.stdout)
                          assert payload['ok'] is True and payload['requests_used'] == 1
                          assert payload['assets'][0]['evidence'][-1]['http_status'] == 200
                          assert json.loads((output / 'report.json').read_text(encoding='utf-8')) == payload
                          assert (output / 'report.txt').is_file()
                          assert '\x1b' not in result.stdout and 'DO_NOT_PERSIST' not in result.stdout
                  finally:
                      server.shutdown()
                      worker.join(timeout=3)
                      assert not worker.is_alive()
      - name: Smoke installed CLI
        run: |
          pasopati --version
          pasopati --help
          python -m pasopati --help
          pasopati doctor --json --config-dir .local/config
